  <h1 class="hero contact">お問い合わせ</h1>

  <main>
    <form action="#">
      <dl>
        <dt>お問い合わせの種類</dt>
        <dd>
          <label><input type="checkbox" name="kind" value="reservation" />ご予約について</label>
          <label><input type="checkbox" name="kind" value="spa" />温泉について</label>
          <label><input type="checkbox" name="kind" value="sauna" />サウナについて</label>
          <label><input type="checkbox" name="kind" value="massage" />マッサージについて</label>
          <label><input type="checkbox" name="kind" value="other" />その他・ご意見・ご要望など</label>
        </dd>

        <dt>
          <label for="name"> お名前 </label>
        </dt>
        <dd><input type="text" name="name" id="name" /></dd>

        <dt>
          <label for="name-reading"> お名前【カタカナ】 </label>
        </dt>
        <dd><input type="text" name="name-reading" id="name-reading" /></dd>

        <dt>
          <label for="email"> メールアドレス </label>
        </dt>
        <dd><input type="email" name="email" id="email" /></dd>

        <dt>
          <label for="inquiry"> お問い合わせ内容 </label>
        </dt>

        <dd><textarea name="inquiry" id="inquiry" cols="30"></textarea></dd>
      </dl>

      <p class="submit"><input type="submit" value="送信" /></p>
    </form>
  </main>
